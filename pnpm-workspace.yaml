packages:
  - 'extensions/*'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@shopify/app-bridge-react@4.2.14'
  - '@shopify/app-bridge-types@0.7.3'

permissions:
  void:
    skills: true

shamefullyHoist: true

overrides:
  qs: ^6.16.0
